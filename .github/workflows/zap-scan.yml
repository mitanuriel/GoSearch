name: OWASP ZAP Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  owasp-zap:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: gosearch_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install dependencies
      run: |
        cd src/backend
        go mod download
        go mod verify

    - name: Build Go application
      run: |
        cd src/backend
        go build -o gosearch .

    - name: Start the application
      run: |
        cd src/backend
        export DB_HOST=localhost
        export DB_PORT=5432
        export DB_USER=postgres
        export DB_PASSWORD=testpass
        export DB_NAME=gosearch_test
        export PORT=8080
        export ES_HOST=localhost
        export ES_PASSWORD=changeme
        export ES_USERNAME=elastic
        ./gosearch &
        sleep 10  # Give the app time to start
      
    - name: Verify application is running
      run: |
        curl --retry 10 --retry-connrefused --retry-delay 3 http://localhost:8080 || echo "App may not be fully ready"

    - name: ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        target: 'http://localhost:8080'
        cmd_options: '-a'  # Auto mode - passive scan only for quick results
        allow_issue_writing: true
      
    - name: Upload ZAP Report
    
      uses: actions/upload-artifact@v4
      with:
        name: zap-scan-report
        path: report_html.html
        retention-days: 30

    - name: Upload ZAP Markdown Report
  
      uses: actions/upload-artifact@v4
      with:
        name: zap-scan-markdown
        path: report_md.md
        retention-days: 30
