name: OWASP ZAP Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  owasp-zap:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: gosearch_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install dependencies
      run: |
        cd src/backend
        go mod download
        go mod verify

    - name: Build Go application
      run: |
        cd src/backend
        go build -o gosearch .

    - name: Start the application
      run: |
        cd src/backend
        # Set environment variables for the app
        export CONN_STR="host=localhost port=5432 user=postgres password=testpass dbname=gosearch_test sslmode=disable"
        export PORT=8080
        # Disable Elasticsearch to avoid connection issues in test environment
        export ES_HOST=""
        # Start the application in background
        nohup ./gosearch > app.log 2>&1 &
        APP_PID=$!
        echo "Started app with PID: $APP_PID"
        # Wait for app to be ready
        for i in {1..30}; do
          if curl -s http://localhost:8080 > /dev/null; then
            echo "Application is ready!"
            break
          fi
          echo "Waiting for application to start... ($i/30)"
          sleep 2
        done
        # Show app logs if it failed to start
        if ! curl -s http://localhost:8080 > /dev/null; then
          echo "Application failed to start. Logs:"
          cat app.log
          exit 1
        fi
      
    - name: Verify application is running
      run: |
        echo "Testing application endpoints..."
        curl -v http://localhost:8080 || exit 1
        echo "Application is responding correctly!"

    - name: ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        target: 'http://localhost:8080'
        cmd_options: '-a'  # Auto mode - passive scan only for quick results
        allow_issue_writing: true
      
    - name: Upload ZAP Report
    
      uses: actions/upload-artifact@v4
      with:
        name: zap-scan-report
        path: report_html.html
        retention-days: 30

    - name: Upload ZAP Markdown Report
  
      uses: actions/upload-artifact@v4
      with:
        name: zap-scan-markdown
        path: report_md.md
        retention-days: 30
