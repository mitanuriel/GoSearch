name: Full CD with Docker

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  DOCKER_USERNAME: ${{ github.actor }}
  DOCKER_REGISTRY: ghcr.io
  SSH_USER: ${{ secrets.SERVER_USER }}
  SSH_HOST: ${{ secrets.SERVER_HOST }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/mitanuriel/gosearch:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
        - name: Checkout code
          uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

        - name: Add SSH key to runner
          run: |
            mkdir -p ~/.ssh/
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/ssh_key
            chmod 600 ~/.ssh/ssh_key
          env:
            SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        
        - name: Add server to known hosts
          run: |
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
        
        - name: Transfer Docker-Compose to server
          run: |
            scp -i ~/.ssh/ssh_key ./docker-compose.dev.yml $SSH_USER@$SSH_HOST:~/GoSearch/

        - name: Check docker installation
          run: |
            ssh -i ~/.ssh/ssh_key $SSH_USER@$SSH_HOST << 'EOF'
            if ! command -v docker &> /dev/null; then
              echo "Could not find docker, installing..."
              sudo apt-get update
              sudo apt-get install ca-certificates curl
              sudo install -m 0755 -d /etc/apt/keyrings
              sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
              sudo chmod a+r /etc/apt/keyrings/docker.asc

              architecture=$(dpkg --print-architecture) 
              codename=$(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
              echo "deb [arch=${architecture} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${codename} stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            else
              echo "Docker is already installed"
            fi
            EOF
          
        - name: Check docker-compose installation
          run: |
            ssh -i ~/.ssh/ssh_key $SSH_USER@$SSH_HOST << 'EOF'
            if ! command -v docker-compose &> /dev/null; then
              echo "Could not find docker-compose, installing..."
              sudo curl -SL https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              sudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose
            else
              echo "Docker-compose is already installed"  
            fi
            EOF

        - name: Stop and remove existing container
          run: |
            ssh -i ~/.ssh/ssh_key $SSH_USER@$SSH_HOST << 'EOF'
            docker stop go-app 2>/dev/null || true
            docker rm go-app 2>/dev/null || true
            EOF

        - name: Deploy to server
          run: |
            ssh -i ~/.ssh/ssh_key $SSH_USER@$SSH_HOST << 'EOF'
            mkdir -p ~/GoSearch
            cd ~/GoSearch
            docker-compose -f docker-compose.dev.yml down -v || true
            docker-compose -f docker-compose.dev.yml pull
            docker-compose -f docker-compose.dev.yml up -d --force-recreate
            EOF

        - name: Clean up Docker resources
          run: |
            ssh -i ~/.ssh/ssh_key $SSH_USER@$SSH_HOST << 'EOF'
            docker container prune -f
            docker image prune -f
            EOF
